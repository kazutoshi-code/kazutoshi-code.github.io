<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyLog — 学習記録</title>
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyLog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a;
  --card:rgba(255,255,255,.055);
  --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10);
  --txt:#eef1f8;
  --sub:#8e99b8;
  --pri:#7c5cff;
  --pri2:#22d3ee;
  --ok:#34d399;
  --mid:#fbbf24;
  --ng:#fb7185;
  --r:18px;
  --nav:calc(64px + env(safe-area-inset-bottom));
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 calc(var(--nav) + 24px);
  min-height:100vh;overscroll-behavior-y:contain;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70vw 38vh at 12% -6%, rgba(124,92,255,.38), transparent 62%),
    radial-gradient(55vw 32vh at 96% 2%, rgba(34,211,238,.20), transparent 60%),
    radial-gradient(80vw 40vh at 50% 105%, rgba(236,72,153,.10), transparent 60%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select{font-size:16px}
a{color:var(--pri2)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(8px)}
.card+.card,section+section,.stack>*+*{margin-top:12px}
.muted{color:var(--sub)}
.tiny{font-size:11px}
.sm{font-size:13px}
.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-t{font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:700;margin:22px 4px 10px}

/* header */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.hdr .d{font-size:12px;color:var(--sub);letter-spacing:.08em}
.hdr h1{margin:4px 0 0;font-size:22px;letter-spacing:.01em}
.lvpill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:14px;
  background:linear-gradient(140deg,rgba(124,92,255,.45),rgba(34,211,238,.28));border:1px solid rgba(255,255,255,.16);min-width:64px}
.lvpill b{font-size:17px;line-height:1}
.lvpill .tiny{color:rgba(255,255,255,.75)}

/* goal ring */
.goal{display:flex;align-items:center;gap:16px;
  background:linear-gradient(145deg,rgba(124,92,255,.22),rgba(34,211,238,.10));border-color:rgba(255,255,255,.14)}
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:26px;line-height:1}
.ring .in span{font-size:11px;color:var(--sub);margin-top:3px}

/* tiles */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.tile b{display:block;font-size:19px;line-height:1.2}
.tile span{display:block;font-size:11px;color:var(--sub);margin-top:4px}

/* progress bar */
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.o{background:linear-gradient(90deg,#34d399,#10b981)}
.bar i.t{background:#fbbf24}
.bar i.x{background:#fb7185}
.bar i.p{background:linear-gradient(90deg,var(--pri),var(--pri2))}

/* list rows */
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .08s}
.item:active{transform:scale(.985)}
.item+.item{margin-top:10px}
.dot{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;flex:0 0 auto;color:#0a0e1a}
.chev{color:var(--sub);flex:0 0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 16px;border-radius:14px;
  background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.btn:active{opacity:.75}
.btn.pri{background:linear-gradient(135deg,var(--pri),#a855f7);border-color:transparent;color:#fff;
  box-shadow:0 8px 22px -10px rgba(124,92,255,.9)}
.btn.w{width:100%}
.btn.gh{background:transparent}
.btn.dg{color:var(--ng);border-color:rgba(251,113,133,.35)}

/* record buttons */
.recs{display:flex;gap:7px;flex:0 0 auto}
.rec{width:44px;height:44px;border-radius:13px;border:1.5px solid;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;transition:transform .1s}
.rec:active{transform:scale(.88)}
.rec.o{color:var(--ok);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.10)}
.rec.t{color:var(--mid);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.10)}
.rec.x{color:var(--ng);border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.10)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--sub)}
.chip.on{background:linear-gradient(135deg,var(--pri),#a855f7);color:#fff;border-color:transparent}

/* badges */
.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.03em;flex:0 0 auto}
.b-new{background:rgba(255,255,255,.10);color:var(--sub)}
.b-weak{background:rgba(251,113,133,.16);color:var(--ng)}
.b-review{background:rgba(251,191,36,.16);color:var(--mid)}
.b-learn{background:rgba(34,211,238,.16);color:var(--pri2)}
.b-master{background:rgba(52,211,153,.16);color:var(--ok)}

/* history pips */
.pips{display:flex;gap:3px;margin-top:6px}
.pip{width:7px;height:7px;border-radius:2px}
.pip.o{background:var(--ok)}.pip.t{background:var(--mid)}.pip.x{background:var(--ng)}

/* charts */
.chart{display:flex;align-items:flex-end;gap:5px;height:118px;margin-top:6px}
.cbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:100%}
.cbar .st{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--pri2),var(--pri));min-height:2px}
.cbar .lb{text-align:center;font-size:9px;color:var(--sub)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:8px}
.hc{width:100%;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(12,16,28,.86);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;color:var(--sub);font-size:10.5px;font-weight:700}
nav button.on{color:#fff}
nav button.on svg{stroke:url(#ng)}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* modal */
.back{position:fixed;inset:0;z-index:60;background:rgba(4,6,12,.66);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:560px;background:#141a2b;border:1px solid var(--line);border-bottom:0;
  border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.9,.3,1);
  max-height:88vh;overflow:auto}
.sheet h3{margin:4px 0 14px;font-size:17px}
.grip{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto 12px}
label.f{display:block;font-size:12px;color:var(--sub);font-weight:700;margin:0 0 6px}
.fld{width:100%;padding:13px 14px;border-radius:13px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);outline:none}
.fld:focus{border-color:var(--pri)}
.fg+.fg{margin-top:14px}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:11px;border:2px solid transparent}
.sw button.on{border-color:#fff;transform:scale(1.06)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px);z-index:70;
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#1b2237;
  border:1px solid var(--line);box-shadow:0 14px 34px -12px #000;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,520px)}
#toast.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#toast button{color:var(--pri2);font-weight:800;font-size:13px;flex:0 0 auto}

.empty{text-align:center;padding:34px 16px;color:var(--sub);font-size:13.5px;line-height:1.7}
.empty .ic{font-size:34px;margin-bottom:8px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--nav) + 14px);z-index:35;
  width:56px;height:56px;border-radius:19px;background:linear-gradient(135deg,var(--pri),#a855f7);
  display:flex;align-items:center;justify-content:center;font-size:27px;color:#fff;
  box-shadow:0 14px 30px -10px rgba(124,92,255,.95)}
.fab:active{transform:scale(.93)}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13.5px;font-weight:700;margin-bottom:12px}
.hint{font-size:11.5px;color:var(--sub);margin-top:7px;line-height:1.6}
.spark{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs></svg>

<div class="wrap" id="app"></div>
<div id="fab"></div>
<nav><div class="in" id="nav"></div></nav>
<div id="toast"></div>
<div id="modal"></div>

<script>
/* ========== storage ========== */
const KEY='studylog.v1';
const DEF={version:1,books:[],settings:{dailyGoal:10}};
const DAY=86400000;
const COLORS=['#7c5cff','#22d3ee','#34d399','#fbbf24','#fb7185','#f472b6','#60a5fa','#a3e635'];

let S=load(), view={t:'home'}, editMode=false, filter='all', undoRef=null, toastTimer=null;

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    return fix(JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function fix(d){
  d=d||{}; d.version=1;
  d.books=Array.isArray(d.books)?d.books:[];
  d.settings=Object.assign({dailyGoal:10},d.settings||{});
  d.books.forEach(b=>{
    b.id=b.id||uid(); b.title=b.title||'無題'; b.color=b.color||COLORS[0];
    b.problems=Array.isArray(b.problems)?b.problems:[];
    b.problems.forEach(p=>{p.id=p.id||uid();p.history=Array.isArray(p.history)?p.history:[]});
  });
  return d;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('保存できませんでした（容量超過？）'); } }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

/* ========== helpers ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const WD=['日','月','火','水','木','金','土'];
function ago(ts){
  const d=Math.floor((sod(Date.now())-sod(ts))/DAY);
  if(d<=0)return '今日'; if(d===1)return '昨日'; if(d<7)return d+'日前';
  if(d<30)return Math.floor(d/7)+'週間前'; return Math.floor(d/30)+'ヶ月前';
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function book(id){ return S.books.find(b=>b.id===id); }
function allP(){ const r=[]; S.books.forEach(b=>b.problems.forEach(p=>r.push({b,p}))); return r; }
function allA(){ const r=[]; S.books.forEach(b=>b.problems.forEach(p=>p.history.forEach(h=>r.push(h)))); return r; }

/* 習熟ステータス */
function stat(p){
  const h=p.history;
  if(!h.length) return 'new';
  let run=0; for(let i=h.length-1;i>=0&&h[i].r==='o';i--) run++;
  if(run>=2) return 'master';
  const last=h[h.length-1].r;
  if(last==='x') return 'weak';
  if(last==='t') return 'review';
  return 'learn';
}
const STAT={
  new:{l:'未着手',c:'b-new'}, weak:{l:'苦手',c:'b-weak'}, review:{l:'あやふや',c:'b-review'},
  learn:{l:'学習中',c:'b-learn'}, master:{l:'習得',c:'b-master'}
};
/* 復習優先度 */
function prio(p){
  const st=stat(p);
  if(st==='new') return -1;
  const days=(sod(Date.now())-sod(p.history[p.history.length-1].t))/DAY;
  const base={weak:100,review:70,learn:34,master:0}[st];
  if(st==='master' && days<14) return -1;
  return base + Math.min(days,60)*2 + (st==='master'?12:0);
}
function acc(list){
  let o=0,n=0; list.forEach(p=>p.history.forEach(h=>{n++;if(h.r==='o')o++}));
  return n? Math.round(o/n*100) : 0;
}
function counts(list){
  const c={o:0,t:0,x:0,n:0};
  list.forEach(p=>p.history.forEach(h=>{c[h.r]++;c.n++}));
  return c;
}
function bookStats(b){
  const c=counts(b.problems);
  const m=b.problems.filter(p=>stat(p)==='master').length;
  const done=b.problems.filter(p=>p.history.length).length;
  return {c,m,done,total:b.problems.length,acc:c.n?Math.round(c.o/c.n*100):0};
}
function todayCount(){ const k=dkey(Date.now()); return allA().filter(h=>dkey(h.t)===k).length; }
function streak(){
  const set=new Set(allA().map(h=>dkey(h.t)));
  let d=sod(Date.now()), n=0;
  if(!set.has(dkey(d))) d-=DAY;
  while(set.has(dkey(d))){ n++; d-=DAY; }
  return n;
}
function xp(){ const c=counts(allP().map(x=>x.p)); return c.o*10+c.t*6+c.x*4; }
function level(){
  let x=xp(), lv=1, need=60;
  while(x>=need){ x-=need; lv++; need=60+(lv-1)*40; }
  return {lv,cur:x,need};
}

/* ========== record ========== */
function rec(bid,pid,r){
  const b=book(bid); if(!b) return;
  const p=b.problems.find(q=>q.id===pid); if(!p) return;
  const before=stat(p);
  const a={t:Date.now(),r};
  p.history.push(a); save();
  undoRef={bid,pid,t:a.t};
  buzz(r==='o'?18:[12,40,12]);
  const after=stat(p);
  let msg = r==='o'?'○ 正解！':(r==='t'?'△ あやふや':'× 不正解 — 復習リストへ');
  if(after==='master'&&before!=='master') msg='🎉 習得！ '+esc(p.label);
  toast(msg,true);
  render();
}
function undo(){
  if(!undoRef) return;
  const b=book(undoRef.bid); if(!b) return;
  const p=b.problems.find(q=>q.id===undoRef.pid); if(!p) return;
  const i=p.history.findIndex(h=>h.t===undoRef.t);
  if(i>=0) p.history.splice(i,1);
  undoRef=null; save(); hideToast(); render();
}
function toast(msg,withUndo){
  const el=$('#toast');
  el.innerHTML='<div class="grow">'+msg+'</div>'+(withUndo?'<button data-a="undo">取り消し</button>':'');
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast,2600);
}
function hideToast(){ $('#toast').classList.remove('on'); }

/* ========== views ========== */
function ring(pct,center,sub){
  const R=46,C=2*Math.PI*R, off=C*(1-Math.min(pct,1));
  return '<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104">'+
    '<circle cx="52" cy="52" r="'+R+'" stroke="rgba(255,255,255,.10)" stroke-width="9" fill="none"/>'+
    '<circle cx="52" cy="52" r="'+R+'" stroke="url(#rg)" stroke-width="9" fill="none" stroke-linecap="round" '+
    'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="transition:stroke-dashoffset .5s"/>'+
    '</svg><div class="in"><b>'+center+'</b><span>'+sub+'</span></div></div>';
}
function pips(p){
  const h=p.history.slice(-8);
  if(!h.length) return '';
  return '<div class="pips">'+h.map(x=>'<i class="pip '+x.r+'"></i>').join('')+'</div>';
}

function vHome(){
  const now=new Date();
  const lv=level(), tc=todayCount(), goal=Math.max(1,S.settings.dailyGoal|0);
  const st=streak(), ps=allP().map(x=>x.p);
  const c=counts(ps), a=c.n?Math.round(c.o/c.n*100):0;
  const due=ps.filter(p=>prio(p)>0).length;
  const msg = tc===0 ? '今日はまだ0問。1問だけでも始めよう！'
    : tc>=goal ? '目標達成！このまま積み上げよう 🔥' : 'あと'+(goal-tc)+'問で今日の目標クリア！';

  let h='<div class="hdr"><div><div class="d">'+(now.getMonth()+1)+'月'+now.getDate()+'日('+WD[now.getDay()]+')</div>'+
    '<h1>'+(now.getHours()<11?'おはよう':now.getHours()<18?'こんにちは':'今日もおつかれさま')+' 👋</h1></div>'+
    '<div class="lvpill"><span class="tiny">LEVEL</span><b>'+lv.lv+'</b><span class="tiny">'+lv.cur+'/'+lv.need+'</span></div></div>';

  h+='<section class="card goal">'+ring(tc/goal,tc+'<span style="font-size:13px;color:var(--sub)">/'+goal+'</span>','今日の解答')+
    '<div class="grow"><div class="b" style="font-size:15px;line-height:1.5">'+msg+'</div>'+
    '<div class="hint">レベル'+lv.lv+' · 次のレベルまで '+(lv.need-lv.cur)+'XP</div>'+
    '<div class="bar" style="margin-top:9px"><i class="p" style="width:'+Math.round(lv.cur/lv.need*100)+'%"></i></div></div></section>';

  h+='<div class="grid3" style="margin-top:12px">'+
    '<div class="tile"><b>'+(st>0?'🔥 ':'')+st+'</b><span>連続日数</span></div>'+
    '<div class="tile"><b>'+c.n+'</b><span>総解答数</span></div>'+
    '<div class="tile"><b>'+a+'%</b><span>正答率</span></div></div>';

  if(due>0){
    h+='<button class="item" data-a="tab" data-v="review" style="margin-top:12px;background:linear-gradient(135deg,rgba(251,113,133,.20),rgba(251,191,36,.12));border-color:rgba(251,113,133,.28)">'+
      '<div class="dot" style="background:linear-gradient(135deg,#fb7185,#fbbf24)">↻</div>'+

function vStats(){
  const A=allA(), ps=allP().map(x=>x.p), c=counts(ps);
  let h='<div class="hdr"><div><div class="d">STATISTICS</div><h1>記録</h1></div></div>';

  h+='<div class="grid3">'+
    '<div class="tile"><b>'+(streak()>0?'🔥 ':'')+streak()+'</b><span>連続日数</span></div>'+
    '<div class="tile"><b>'+c.n+'</b><span>総解答</span></div>'+
    '<div class="tile"><b>'+(c.n?Math.round(c.o/c.n*100):0)+'%</b><span>正答率</span></div></div>';

  /* 14日棒グラフ */
  const days=[], base=sod(Date.now());
  for(let i=13;i>=0;i--){ const t=base-i*DAY; days.push({t,k:dkey(t),n:0}); }
  const map={}; days.forEach(d=>map[d.k]=d);
  A.forEach(a=>{ const d=map[dkey(a.t)]; if(d)d.n++; });
  const mx=Math.max(1,...days.map(d=>d.n));
  h+='<div class="sec-t">この2週間</div><section class="card">'+
    '<div class="chart">'+days.map(d=>{
      const hh=Math.round(d.n/mx*96);
      return '<div class="cbar"><div class="st" style="height:'+(d.n?Math.max(hh,4):0)+'px;opacity:'+(d.n?1:.25)+'"></div>'+
        '<div class="lb">'+new Date(d.t).getDate()+'</div></div>';
    }).join('')+'</div>'+
    '<div class="hint">合計 '+days.reduce((s,d)=>s+d.n,0)+' 問 / 1日平均 '+(days.reduce((s,d)=>s+d.n,0)/14).toFixed(1)+' 問</div></section>';

  /* ヒートマップ 12週 */
  const cnt={}; A.forEach(a=>{ const k=dkey(a.t); cnt[k]=(cnt[k]||0)+1; });
  const cells=[]; const today=new Date(base); const end=base+(6-today.getDay())*DAY;
  for(let i=83;i>=0;i--){ const t=end-i*DAY; cells.push({t,n:cnt[dkey(t)]||0,fut:t>base}); }
  const hmx=Math.max(1,...cells.map(x=>x.n));
  h+='<div class="sec-t">学習カレンダー</div><section class="card">'+
    '<div class="heat">'+cells.map(x=>{
      const r=x.n/hmx;
      const bg=x.n? 'background:linear-gradient(135deg,rgba(124,92,255,'+(0.35+r*0.65)+'),rgba(34,211,238,'+(0.3+r*0.6)+'))':'';
      return '<div class="hc" style="'+bg+(x.fut?';opacity:.25':'')+'" title="'+dkey(x.t)+': '+x.n+'問"></div>';
    }).join('')+'</div>'+
    '<div class="hint">濃いほど多く解いた日です（直近12週間）</div></section>';

  /* 問題集別 */
  if(S.books.length){
    h+='<div class="sec-t">問題集別の成績</div><section class="card">';
    S.books.forEach((b,i)=>{
      const s=bookStats(b);
      h+='<div style="'+(i?'margin-top:15px':'')+'"><div class="between"><div class="sm b ell">'+esc(b.title)+'</div>'+
        '<div class="tiny muted">'+s.c.n+'回 / '+s.acc+'%</div></div>'+
        '<div class="bar" style="margin-top:7px">'+
        (s.c.n?('<i class="o" style="width:'+(s.c.o/s.c.n*100)+'%"></i><i class="t" style="width:'+(s.c.t/s.c.n*100)+'%"></i><i class="x" style="width:'+(s.c.x/s.c.n*100)+'%"></i>'):'')+
        '</div></div>';
    });
    h+='</section>';
  }

  /* 設定 */
  h+='<div class="sec-t">設定・データ</div><section class="card">'+
    '<label class="f">1日の目標問題数</label>'+
    '<div class="row"><input class="fld grow" type="number" inputmode="numeric" min="1" max="999" id="goalIn" value="'+(S.settings.dailyGoal|0)+'">'+
    '<button class="btn pri" data-a="setgoal" style="flex:0 0 auto">保存</button></div>'+
    '<div class="stack" style="margin-top:16px">'+
    '<button class="btn w" data-a="export">⬇ データを書き出し（バックアップ）</button>'+
    '<button class="btn w" data-a="import">⬆ データを読み込み</button>'+
    '<button class="btn w dg" data-a="reset">すべてのデータを削除</button></div>'+
    '<div class="hint">データはこの端末のブラウザ内だけに保存されます。機種変更前に必ず書き出してください。</div></section>';
  return h;
}

function parseSpec(spec){
  const out=[];
  String(spec).split(/[,、\s]+/).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^(\d+)[-−~〜ー](\d+)$/);
    if(m){
      let a=+m[1], b=+m[2];
      if(a>b){ const s=a;a=b;b=s; }
      if(b-a>499) b=a+499;
      for(let i=a;i<=b;i++) out.push(String(i));
    }else out.push(tok);
  });
  return out;
}

/* ========== events ========== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){
    return;
  }
  const a=t.dataset.a;

  if(a==='closem'){ if(e.target.closest('[data-stop]')) return; closeM(); return; }
  if(a==='tab'){ view={t:t.dataset.v}; editMode=false; filter='all'; window.scrollTo(0,0); render(); return; }
  if(a==='open'){ view={t:'book',id:t.dataset.id}; editMode=false; filter='all'; window.scrollTo(0,0); render(); return; }
  if(a==='filter'){ filter=t.dataset.v; view.keep=true; render(); return; }
  if(a==='toggleedit'){ editMode=!editMode; view.keep=true; render(); return; }
  if(a==='undo'){ undo(); return; }

  if(a==='rec'){ view.keep=true; rec(view.id,t.dataset.id,t.dataset.r); return; }
  if(a==='rec2'){ view.keep=true; rec(t.dataset.b,t.dataset.id,t.dataset.r); return; }

  if(a==='addbook'){ mAddBook(false); return; }
  if(a==='editbook'){ mAddBook(true); return; }
  if(a==='bookmenu'){ mBookMenu(); return; }
  if(a==='color'){ pickColor=t.dataset.v;
    document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.v===pickColor)); return; }

  if(a==='createbook'||a==='savebook'){
    const title=($('#bTitle').value||'').trim();
    if(!title){ $('#bTitle').focus(); toast('名前を入力してください'); return; }
    const sub=($('#bSub').value||'').trim();
    if(a==='createbook'){
      const b={id:uid(),title,subject:sub,color:pickColor,problems:[],created:Date.now()};
      S.books.push(b); save(); closeM();
      view={t:'book',id:b.id}; render(); mAddP();
    }else{
      const b=book(view.id); b.title=title; b.subject=sub; b.color=pickColor;
      save(); closeM(); render(); toast('保存しました');
    }
    return;
  }
  if(a==='addp'){ if(view.t!=='book'){ toast('問題集を開いてください'); return; } mAddP(); return; }
  if(a==='createp'){
    const b=book(view.id); if(!b) return;
    const pre=($('#pPre').value||'').trim();
    const toks=parseSpec($('#pSpec').value||'');
    if(!toks.length){ $('#pSpec').focus(); toast('問題番号を入力してください'); return; }
    const exist=new Set(b.problems.map(p=>p.label));
    let n=0;
    toks.forEach(tk=>{
      const label=(pre?pre+tk:tk).trim();
      if(!label||exist.has(label)) return;
      exist.add(label);
      b.problems.push({id:uid(),label,history:[]}); n++;
    });
    save(); closeM(); filter='all'; render();
    toast(n?(n+'問を追加しました'):'追加できる新しい問題がありません');
    return;
  }
  if(a==='delp'){
    const b=book(view.id); if(!b) return;
    const p=b.problems.find(q=>q.id===t.dataset.id); if(!p) return;
    if(!confirm('「'+p.label+'」を記録ごと削除しますか？')) return;
    b.problems=b.problems.filter(q=>q.id!==p.id);
    save(); view.keep=true; render(); return;
  }
  if(a==='delbook'){
    const b=book(view.id); if(!b) return;
    if(!confirm('「'+b.title+'」と'+b.problems.length+'問の記録をすべて削除します。よろしいですか？')) return;
    S.books=S.books.filter(x=>x.id!==b.id);
    save(); closeM(); view={t:'books'}; render(); toast('削除しました'); return;
  }
  if(a==='clearhist'){
    const b=book(view.id); if(!b) return;
    if(!confirm('「'+b.title+'」の解答記録だけをリセットします（問題番号は残ります）。よろしいですか？')) return;
    b.problems.forEach(p=>p.history=[]);
    save(); closeM(); render(); toast('記録をリセットしました'); return;
  }
  if(a==='setgoal'){
    const v=parseInt($('#goalIn').value,10);
    if(!v||v<1){ toast('1以上の数を入力してください'); return; }
    S.settings.dailyGoal=Math.min(v,999); save(); view.keep=true; render(); toast('目標を'+S.settings.dailyGoal+'問に設定しました'); return;
  }
  if(a==='export'){
    const name='studylog-'+dkey(Date.now())+'.json';
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a2=document.createElement('a'); a2.href=url; a2.download=name; document.body.appendChild(a2); a2.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a2.remove();},1000);
    toast('書き出しました'); return;
  }
  if(a==='import'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const d=fix(JSON.parse(r.result));
          if(!Array.isArray(d.books)) throw 0;
          if(!confirm('現在のデータを、読み込むデータで置き換えます。よろしいですか？')) return;
          S=d; save(); view={t:'home'}; render(); toast('読み込みました');
        }catch(err){ toast('ファイルを読み込めませんでした'); }
      };
      r.readAsText(f);
    };
    inp.click(); return;
  }
  if(a==='reset'){
    if(!confirm('すべての問題集と記録を削除します。元に戻せません。よろしいですか？')) return;
    if(!confirm('本当に削除しますか？')) return;
    S=JSON.parse(JSON.stringify(DEF)); save(); view={t:'home'}; render(); toast('初期化しました'); return;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeM(); });

/* PWA */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

render();
</script>
</body>
</html>
